<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgroLucro</title>

    <!-- Ligacao com o arquivo CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Cabecalho do sistema -->
    <header>
        <h1>AgroLucro</h1>
        <p>Sistema de Controle Financeiro Rural</p>
    </header>

    <!-- Conteudo principal -->
    <main>

        <div class="login">

            <h2>Entrar no Sistema</h2>

            <!-- Formulario de login -->
            <form action="../dashboard/dashboard.html">

                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">Senha:</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button type="submit">Entrar</button>

            </form>

            <p>Não possui uma conta?</p>

            <a href="../cadastro/cadastro.html">
                Cadastre-se
            </a>

        </div>

    </main>

    <!-- Rodape -->
    <footer>
        <p>AgroLucro - Projeto Acadêmico</p>
    </footer>

</body>
</html>
