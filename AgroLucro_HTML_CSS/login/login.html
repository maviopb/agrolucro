<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgroLucro</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Cabecalho -->
    <header>
        <h1>AgroLucro</h1>
        <p>Sistema de Controle Financeiro Rural</p>
    </header>

    <main>
        <div class="login">

            <h2>Entrar no Sistema</h2>

            <!-- Formulario demonstrativo -->
            <form action="../dashboard/dashboard.html" method="get">

                <label for="email">E-mail:</label>
                <input type="email" id="email"
                       placeholder="Digite seu e-mail" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha"
                       placeholder="Digite sua senha" required>

                <button type="submit">Entrar</button>

            </form>

            <a href="../cadastro/cadastro.html">
                Cadastro de produtores
            </a>

        </div>
    </main>

    <footer>
        <p>AgroLucro - Projeto Acadêmico 2026</p>
    </footer>

</body>
</html>
